<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Eda AI</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eda AI">
<meta name="theme-color" content="#f3f4f6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none}
  .noscroll::-webkit-scrollbar{display:none}
  .sheet{transition:transform .3s cubic-bezier(.32,.72,0,1)}
  .fade{animation:f .2s ease}
  @keyframes f{from{opacity:0}to{opacity:1}}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom)}
  .pt-safe{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body class="bg-gray-100">

<div class="max-w-md mx-auto bg-gray-100 min-h-screen relative pb-32">

  <!-- ===== HEADER ===== -->
  <div class="bg-gradient-to-b from-gray-500 to-gray-100 pt-safe">
    <div class="pt-6 pb-2 text-center">
      <h1 class="text-3xl font-bold text-white drop-shadow">Eda AI</h1>
    </div>

    <!-- Hafta -->
    <div class="flex items-center px-3 pb-4">
      <button onclick="shiftWeek(-1)" class="w-8 h-8 text-white/80 text-xl">‹</button>
      <div id="week" class="flex-1 flex justify-between"></div>
      <button onclick="shiftWeek(1)" class="w-8 h-8 text-white/80 text-xl">›</button>
    </div>
  </div>

  <!-- ===== RING ===== -->
  <div class="flex justify-center -mt-2 mb-6">
    <div class="relative w-52 h-52">
      <svg class="w-52 h-52 -rotate-90" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="6"/>
        <circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="#1f2937" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5"
                style="transition:stroke-dashoffset .5s"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <div id="kcalLeft" class="text-5xl font-bold text-gray-800">0</div>
        <div class="text-gray-500 text-sm mt-1">Qolgan</div>
        <div class="text-gray-500 text-sm">kaloriyalar</div>
      </div>
    </div>
  </div>

  <!-- ===== MAKROLAR ===== -->
  <div class="grid grid-cols-3 gap-2 px-3 mb-6">
    <div class="bg-white rounded-2xl p-3 shadow-sm">
      <div class="flex items-center gap-1"><span class="text-lg">🍗</span><span id="pLeft" class="font-bold">0g</span></div>
      <div class="text-[11px] text-gray-500 mt-1">Qolgan oqsil</div>
      <div class="h-1 bg-gray-200 rounded-full mt-2"><div id="pBar" class="h-1 bg-red-400 rounded-full" style="width:0"></div></div>
    </div>
    <div class="bg-white rounded-2xl p-3 shadow-sm">
      <div class="flex items-center gap-1"><span class="text-lg">🌾</span><span id="cLeft" class="font-bold">0g</span></div>
      <div class="text-[11px] text-gray-500 mt-1">Qolgan uglevod</div>
      <div class="h-1 bg-gray-200 rounded-full mt-2"><div id="cBar" class="h-1 bg-amber-400 rounded-full" style="width:0"></div></div>
    </div>
    <div class="bg-white rounded-2xl p-3 shadow-sm">
      <div class="flex items-center gap-1"><span class="text-lg">🥑</span><span id="fLeft" class="font-bold">0g</span></div>
      <div class="text-[11px] text-gray-500 mt-1">Qolgan yog'</div>
      <div class="h-1 bg-gray-200 rounded-full mt-2"><div id="fBar" class="h-1 bg-blue-400 rounded-full" style="width:0"></div></div>
    </div>
  </div>

  <!-- ===== 7 KUNLIK GRAFIK ===== -->
  <div class="px-3 mb-6">
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <div class="text-sm font-semibold text-gray-700 mb-3">Oxirgi 7 kun</div>
      <div id="chart" class="flex items-end justify-between h-20 gap-1"></div>
    </div>
  </div>

  <!-- ===== RO'YXAT ===== -->
  <div class="px-3">
    <h2 class="text-xl font-bold mb-3" id="listTitle">Iste'mol qilindi</h2>
    <div id="list"></div>
  </div>

  <!-- ===== PASTKI PANEL ===== -->
  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t pb-safe">
    <div class="flex items-center justify-around h-16 relative">
      <button onclick="goToday()" class="text-2xl">🏠</button>
      <button onclick="openAdd()" class="absolute left-1/2 -translate-x-1/2 -top-6 w-16 h-16 bg-gray-900 text-white rounded-full text-3xl shadow-xl active:scale-90 transition">+</button>
      <button onclick="openSettings()" class="text-2xl">⚙️</button>
    </div>
  </div>
</div>

<!-- ===== QO'SHISH OYNASI ===== -->
<div id="addBg" class="hidden fixed inset-0 bg-black/40 z-40" onclick="closeAdd()"></div>
<div id="addSheet" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white rounded-t-3xl z-50 sheet translate-y-full pb-safe">
  <div class="p-5">
    <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-5"></div>
    <div id="addStep1">
      <h3 class="text-xl font-bold mb-4">Ovqat qo'shish</h3>
      <div class="space-y-2">
        <button onclick="camIn.click()" class="w-full flex items-center gap-3 p-4 bg-gray-50 rounded-2xl active:bg-gray-100">
          <span class="text-2xl">📷</span><span class="font-semibold">Suratga olish</span>
        </button>
        <button onclick="galIn.click()" class="w-full flex items-center gap-3 p-4 bg-gray-50 rounded-2xl active:bg-gray-100">
          <span class="text-2xl">🖼</span><span class="font-semibold">Galereyadan tanlash</span>
        </button>
        <button onclick="showText()" class="w-full flex items-center gap-3 p-4 bg-gray-50 rounded-2xl active:bg-gray-100">
          <span class="text-2xl">✍️</span><span class="font-semibold">Matn orqali yozish</span>
        </button>
      </div>
    </div>

    <div id="addText" class="hidden">
      <h3 class="text-xl font-bold mb-3">Nima yedingiz?</h3>
      <textarea id="txt" rows="3" placeholder="Masalan: 1 kosa osh va 2 dona non"
        class="w-full p-3 border rounded-2xl outline-none focus:border-gray-900"></textarea>
      <button onclick="analyzeText()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-semibold mt-3">Tahlil qilish</button>
      <button onclick="backStep1()" class="w-full py-3 text-gray-500">Orqaga</button>
    </div>

    <div id="addLoad" class="hidden text-center py-10">
      <div class="inline-block w-10 h-10 border-4 border-gray-200 border-t-gray-900 rounded-full animate-spin"></div>
      <p class="text-gray-500 mt-4">AI tahlil qilmoqda...</p>
    </div>

    <div id="addResult" class="hidden">
      <h3 class="text-xl font-bold mb-3">Tekshiring</h3>
      <input id="rName" class="w-full p-3 border rounded-2xl mb-2 font-semibold" placeholder="Nomi">
      <div class="grid grid-cols-2 gap-2 mb-2">
        <div><label class="text-xs text-gray-500">Kaloriya</label><input id="rKcal" type="number" class="w-full p-3 border rounded-2xl"></div>
        <div><label class="text-xs text-gray-500">Oqsil (g)</label><input id="rP" type="number" class="w-full p-3 border rounded-2xl"></div>
        <div><label class="text-xs text-gray-500">Uglevod (g)</label><input id="rC" type="number" class="w-full p-3 border rounded-2xl"></div>
        <div><label class="text-xs text-gray-500">Yog' (g)</label><input id="rF" type="number" class="w-full p-3 border rounded-2xl"></div>
      </div>
      <button onclick="saveFood()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-semibold">Saqlash</button>
      <button onclick="backStep1()" class="w-full py-3 text-gray-500">Bekor qilish</button>
    </div>
  </div>
</div>

<!-- ===== SOZLAMALAR ===== -->
<div id="setScreen" class="hidden fixed inset-0 bg-gray-100 z-50 overflow-y-auto pt-safe pb-safe">
  <div class="max-w-md mx-auto p-4">
    <div class="flex items-center gap-4 mb-6">
      <button onclick="closeSettings()" class="text-3xl">✕</button>
      <h2 class="text-2xl font-bold">Sozlamalar</h2>
    </div>

    <div class="bg-white rounded-2xl p-4 mb-4">
      <h3 class="font-bold mb-3">Kunlik maqsad</h3>
      <div class="space-y-3">
        <div class="flex items-center gap-3"><span class="text-xl w-8">🔥</span><span class="flex-1 text-sm">Kaloriya</span><input id="gK" type="number" class="w-24 p-2 border rounded-xl text-right"></div>
        <div class="flex items-center gap-3"><span class="text-xl w-8">🍗</span><span class="flex-1 text-sm">Oqsil (g)</span><input id="gP" type="number" class="w-24 p-2 border rounded-xl text-right"></div>
        <div class="flex items-center gap-3"><span class="text-xl w-8">🌾</span><span class="flex-1 text-sm">Uglevod (g)</span><input id="gC" type="number" class="w-24 p-2 border rounded-xl text-right"></div>
        <div class="flex items-center gap-3"><span class="text-xl w-8">🥑</span><span class="flex-1 text-sm">Yog' (g)</span><input id="gF" type="number" class="w-24 p-2 border rounded-xl text-right"></div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 mb-4">
      <h3 class="font-bold mb-3">AI sozlamasi</h3>
      <label class="text-xs text-gray-500">Gemini API kalit</label>
      <input id="sKey" type="password" placeholder="AIza..." class="w-full p-3 border rounded-xl mb-3 text-sm">
      <label class="text-xs text-gray-500">Model nomi</label>
      <input id="sModel" class="w-full p-3 border rounded-xl mb-3 text-sm">
      <button onclick="checkModels()" class="w-full py-3 bg-gray-100 rounded-xl text-sm font-semibold">🔍 Ishlaydigan modellarni ko'rsatish</button>
      <div id="modelList" class="mt-3 text-xs text-gray-600 space-y-1"></div>
    </div>

    <button onclick="saveSettings()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-semibold mb-3">Saqlash</button>
    <button onclick="if(confirm('Barcha tarix o\'chiriladi. Davom etasizmi?'))wipe()" class="w-full py-3 text-red-500 text-sm">Barcha ma'lumotni o'chirish</button>
  </div>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galIn" accept="image/*" class="hidden">

<script>
/* ============ SOZLAMALAR ============ */
const DEF_GOALS = {k:2239,p:172,c:231,f:70};
const DEF_CFG   = {key:'', model:'gemini-3.6-flash'};

let goals = JSON.parse(localStorage.getItem('eda_goals')) || DEF_GOALS;
let cfg   = JSON.parse(localStorage.getItem('eda_cfg'))   || DEF_CFG;
let pending = null;

/* ============ SANA ============ */
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY = ymd(new Date());
let sel = TODAY;
let weekOff = 0;
const DAYS = ['Dush','Sesh','Chor','Pay','Jum','Shan','Yak'];

function weekDays(off){
  const n = new Date();
  const dow = (n.getDay()+6)%7;
  const mon = new Date(n); mon.setDate(n.getDate()-dow+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}

/* ============ MA'LUMOT ============ */
const getLog = d => JSON.parse(localStorage.getItem('eda_log_'+d)) || [];
const setLog = (d,v) => localStorage.setItem('eda_log_'+d, JSON.stringify(v));
const sum = arr => arr.reduce((a,x)=>({k:a.k+ +x.k, p:a.p+ +x.p, c:a.c+ +x.c, f:a.f+ +x.f}),{k:0,p:0,c:0,f:0});

/* ============ RENDER ============ */
function render(){
  // hafta
  document.getElementById('week').innerHTML = weekDays(weekOff).map(d=>{
    const s = ymd(d), fut = s>TODAY, act = s===sel, has = getLog(s).length>0;
    return `<button ${fut?'disabled':''} onclick="pick('${s}')"
      class="flex flex-col items-center px-1 ${fut?'opacity-30':''}">
      <span class="text-xs ${act?'text-white':'text-white/70'}">${DAYS[(d.getDay()+6)%7]}</span>
      <span class="mt-1 w-9 h-9 flex items-center justify-center rounded-xl text-sm font-semibold
        ${act?'bg-white/90 text-gray-900':'text-white'}">${String(d.getDate()).padStart(2,'0')}</span>
      <span class="w-1 h-1 rounded-full mt-1 ${has?'bg-white':'bg-transparent'}"></span>
    </button>`;
  }).join('');

  // ring + makro
  const t = sum(getLog(sel));
  const left = Math.max(0, goals.k-t.k);
  document.getElementById('kcalLeft').textContent = left.toLocaleString('ru');
  document.getElementById('ring').style.strokeDashoffset = 565.5*(1-Math.min(1,t.k/goals.k));

  const set=(id,bar,val,goal,col)=>{
    document.getElementById(id).textContent = Math.max(0,Math.round(goal-val))+'g';
    document.getElementById(bar).style.width = Math.min(100,val/goal*100)+'%';
  };
  set('pLeft','pBar',t.p,goals.p);
  set('cLeft','cBar',t.c,goals.c);
  set('fLeft','fBar',t.f,goals.f);

  // grafik
  document.getElementById('chart').innerHTML = Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i)); const s=ymd(d);
    const v=sum(getLog(s)).k, h=Math.min(100,v/goals.k*100);
    return `<div class="flex-1 flex flex-col items-center gap-1">
      <div class="w-full bg-gray-100 rounded-md flex items-end" style="height:56px">
        <div class="w-full rounded-md ${v>goals.k?'bg-red-400':'bg-gray-800'}" style="height:${h}%"></div>
      </div>
      <span class="text-[9px] text-gray-400">${d.getDate()}</span></div>`;
  }).join('');

  // ro'yxat
  const log = getLog(sel);
  document.getElementById('listTitle').textContent =
    sel===TODAY ? "Bugun iste'mol qilindi" : sel+" kuni";
  document.getElementById('list').innerHTML = log.length ? log.map((x,i)=>`
    <div class="bg-white rounded-2xl p-3 mb-2 flex items-center gap-3 fade">
      <span class="text-2xl">${x.e||'🍽'}</span>
      <div class="flex-1 min-w-0">
        <div class="font-semibold truncate">${x.n}</div>
        <div class="text-xs text-gray-500">${x.k} kcal · O${x.p} U${x.c} Y${x.f}</div>
      </div>
      <button onclick="del(${i})" class="text-gray-300 text-xl px-1">✕</button>
    </div>`).join('')
    : `<div class="bg-white rounded-2xl p-8 text-center">
        <p class="font-semibold">Ma'lumot yo'q</p>
        <p class="text-sm text-gray-500 mt-1">Pastdagi + tugmasini bosing</p></div>`;
}
function pick(s){sel=s;render();}
function goToday(){sel=TODAY;weekOff=0;render();}
function shiftWeek(n){weekOff+=n;render();}
function del(i){const l=getLog(sel);l.splice(i,1);setLog(sel,l);render();}

/* ============ QO'SHISH ============ */
const $=id=>document.getElementById(id);
function openAdd(){$('addBg').classList.remove('hidden');$('addSheet').classList.remove('translate-y-full');backStep1();}
function closeAdd(){$('addBg').classList.add('hidden');$('addSheet').classList.add('translate-y-full');}
function step(s){['addStep1','addText','addLoad','addResult'].forEach(x=>$(x).classList.add('hidden'));$(s).classList.remove('hidden');}
function backStep1(){step('addStep1');}
function showText(){step('addText');setTimeout(()=>$('txt').focus(),300);}

camIn.onchange = e => e.target.files[0] && analyzeImage(e.target.files[0]);
galIn.onchange = e => e.target.files[0] && analyzeImage(e.target.files[0]);

function compress(file){
  return new Promise(res=>{
    const img=new Image(), fr=new FileReader();
    fr.onload=()=>img.src=fr.result;
    img.onload=()=>{
      const m=1024, s=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.8).split(',')[1]);
    };
    fr.readAsDataURL(file);
  });
}

const PROMPT = `Sen ovqat tahlilchisisan. Berilgan ovqatni aniqla va FAQAT quyidagi JSON formatda javob ber, boshqa hech narsa yozma:
{"n":"ovqat nomi o'zbekcha","e":"emoji","k":kaloriya_soni,"p":oqsil_gramm,"c":uglevod_gramm,"f":yog_gramm}
Agar porsiya aniq bo'lmasa, o'rtacha 1 porsiyani hisobla. Raqamlar butun son bo'lsin.`;

async function callAI(parts){
  if(!cfg.key){alert("Avval ⚙️ Sozlamalarda API kalitni kiriting!");closeAdd();openSettings();return null;}
  step('addLoad');
  try{
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${cfg.key}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts}]})
    });
    const j = await r.json();
    if(j.error) throw new Error(j.error.message);
    let t = j.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim();
    return JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}')+1));
  }catch(e){
    alert('Xatolik:\n'+e.message);
    backStep1(); return null;
  }
}

async function analyzeImage(file){
  openAdd(); step('addLoad');
  const b64 = await compress(file);
  const d = await callAI([{text:PROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]);
  if(d) showResult(d);
  camIn.value=galIn.value='';
}
async function analyzeText(){
  const v=$('txt').value.trim(); if(!v)return;
  const d = await callAI([{text:PROMPT+'\n\nOvqat: '+v}]);
  if(d) showResult(d);
}
function showResult(d){
  pending=d;
  $('rName').value=d.n||'Ovqat'; $('rKcal').value=d.k||0;
  $('rP').value=d.p||0; $('rC').value=d.c||0; $('rF').value=d.f||0;
  step('addResult');
}
function saveFood(){
  const l=getLog(sel);
  l.unshift({n:$('rName').value, e:pending?.e||'🍽',
    k:+$('rKcal').value, p:+$('rP').value, c:+$('rC').value, f:+$('rF').value});
  setLog(sel,l); closeAdd(); $('txt').value=''; render();
}

/* ============ SOZLAMALAR ============ */
function openSettings(){
  $('gK').value=goals.k; $('gP').value=goals.p; $('gC').value=goals.c; $('gF').value=goals.f;
  $('sKey').value=cfg.key; $('sModel').value=cfg.model;
  $('setScreen').classList.remove('hidden');
}
function closeSettings(){$('setScreen').classList.add('hidden');}
function saveSettings(){
  goals={k:+$('gK').value||2000,p:+$('gP').value||150,c:+$('gC').value||200,f:+$('gF').value||65};
  cfg={key:$('sKey').value.trim(), model:$('sModel').value.trim()||'gemini-3.6-flash'};
  localStorage.setItem('eda_goals',JSON.stringify(goals));
  localStorage.setItem('eda_cfg',JSON.stringify(cfg));
  closeSettings(); render();
}
async function checkModels(){
  const k=$('sKey').value.trim();
  if(!k)return alert('Avval API kalitni kiriting');
  $('modelList').innerHTML='Tekshirilmoqda...';
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+k);
    const j=await r.json();
    if(j.error)throw new Error(j.error.message);
    $('modelList').innerHTML = j.models
      .filter(m=>m.supportedGenerationMethods?.includes('generateContent'))
      .map(m=>{const n=m.name.replace('models/','');
        return `<div onclick="$('sModel').value='${n}'" class="p-2 bg-gray-50 rounded-lg cursor-pointer active:bg-gray-200">${n}</div>`;
      }).join('');
  }catch(e){$('modelList').innerHTML='<span class="text-red-500">'+e.message+'</span>';}
}
function wipe(){Object.keys(localStorage).filter(k=>k.startsWith('eda_')).forEach(k=>localStorage.removeItem(k));location.reload();}

render();
</script>
</body>
</html>
