<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eda AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow">
        <!-- Header -->
        <div class="bg-gradient-to-b from-gray-800 to-gray-900 text-white p-6 text-center">
            <h1 class="text-3xl font-bold">Eda AI</h1>
            <p class="text-gray-400 mt-1">Ovqat kaloriya hisoblagichi</p>
        </div>

        <!-- Kaloriya -->
        <div class="p-6 text-center">
            <div class="text-6xl font-bold text-gray-800">2239</div>
            <div class="text-gray-500">Qolgan kaloriyalar</div>
        </div>

        <!-- Makrolar -->
        <div class="grid grid-cols-3 gap-3 px-6">
            <div class="bg-white border p-4 rounded-2xl text-center">
                <div class="text-2xl">🐟</div>
                <div class="font-semibold">172g</div>
                <div class="text-sm text-gray-500">Oqsillar</div>
            </div>
            <div class="bg-white border p-4 rounded-2xl text-center">
                <div class="text-2xl">🌾</div>
                <div class="font-semibold">231g</div>
                <div class="text-sm text-gray-500">Uglevodlar</div>
            </div>
            <div class="bg-white border p-4 rounded-2xl text-center">
                <div class="text-2xl">🥑</div>
                <div class="font-semibold">70g</div>
                <div class="text-sm text-gray-500">Yog'lar</div>
            </div>
        </div>

        <!-- Qo'shish tugmasi -->
        <div class="p-6">
            <button onclick="addFood()" 
                    class="w-full bg-black text-white py-4 rounded-2xl text-lg font-semibold active:scale-95 transition">
                + Ovqat qo'shish
            </button>
        </div>
    </div>

    <script>
        function addFood() {
            alert("Bu funksiya keyinroq qo'shiladi!");
        }
    </script>

</body>
</html>
